# Example configuration for CTFd Challenge Downloader
# Copy this file and customize for your CTF instance

# CTFd instance settings
base_url: "https://demo.ctfd.io"
token: "ctfd_your_token_here"     # or set cookie for token-less instances
# cookie: "<session cookie>"

# Download settings
ctf_name: "my-ctf-2026"           # challenges go under output/<ctf_name>/
output_dir: "output"
max_workers: 5
rate_limit: 10  # requests per second

# Retry settings
retry_count: 3
retry_delay: "1s"  # 1s, 2m, 3h, etc.

# Additional data
include_hints: false
include_solves: false